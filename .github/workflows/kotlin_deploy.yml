name: Android CI/CD

on:
  push:
    branches: ["master"]
    tags:
      - "beta"
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin_deploy.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin_deploy.yml"

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x kotlin/gradlew
      - name: Run tests
        working-directory: ./kotlin
        run: ./gradlew testDebugUnitTest

  publish:
    name: Build & Publish APK
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || contains(github.ref, 'beta'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x kotlin/gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > kotlin/app/release-key.jks

      - name: Create secrets.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "MAPS_API_KEY=$MAPS_API_KEY" > kotlin/secrets.properties

      - name: Build
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        working-directory: ./kotlin
        run: ./gradlew assembleRelease

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: city-explorer-build
          path: kotlin/app/build/outputs/apk/release/app-release.apk

      - name: Update GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: kotlin/app/build/outputs/apk/release/app-release.apk
          name: "v1.0.0"
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update beta release
        if: github.event_name == 'push' && contains(github.ref, 'beta')
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "beta"
          prerelease: true
          title: "Development Build"
          files: kotlin/app/build/outputs/apk/release/app-release.apk

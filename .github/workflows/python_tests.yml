name: Python Tests

on:
  push:
    branches: ["master", "dev"]
    paths:
      - "python/**"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - "python/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt

      - name: Run tests with pytest
        run: |
          cd python
          pytest tests/

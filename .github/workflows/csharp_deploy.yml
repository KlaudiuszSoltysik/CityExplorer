name: Backend CI/CD

on:
  push:
    branches: ["master"]
    paths:
      - "csharp/**"
      - ".github/workflows/csharp_deploy.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "csharp/**"
      - ".github/workflows/csharp_deploy.yml"

env:
  REGISTRY: ghcr.io
  API_NAME: KlaudiuszSoltysik/city-explorer/api
  WORKER_IMAGE: KlaudiuszSoltysik/city-explorer/worker

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test csharp/csharp.sln

  build-and-push:
    name: Build and push image
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push API image
      - name: Extract metadata for API
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./csharp
          file: ./csharp/api/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Build and push Worker image
      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Worker
        uses: docker/build-push-action@v5
        with:
          context: ./csharp
          file: ./csharp/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      # Generate and commit documentation
      - name: Setup .NET for Docs Generation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Generate Documentation JSON
        run: dotnet build csharp/src/src.csproj -c Release

      - name: Commit and push documentation
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Upewnij się, że ścieżka do pliku JSON jest dobra
          git add csharp/src/api_documentation.json 
          git commit -m "docs: automatic api documentation update" || echo "No changes to commit"
          git push

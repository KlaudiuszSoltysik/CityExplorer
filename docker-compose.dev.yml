services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: z_city_explorer_postgres_dev
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT_DEV}:5432"
    volumes:
      - ./docker/postgres/dev_data:/var/lib/postgresql/data
    networks:
      - city_explorer_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:alpine
    container_name: z_city_explorer_redis_dev
    ports:
      - "6379:6379"
    networks:
      - city_explorer_net

  api-dev:
    container_name: z_city_explorer_api_dev
    build:
      context: ./csharp
      dockerfile: api/Dockerfile.dev
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres-dev;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__RedisConnection=redis-dev:6379
      - JwtSettings__SecretKey=${JWT_SECTRET_KEY}
    ports:
      - "${CSHARP_PORT_DEV}:8080"
    volumes:
      - ./csharp:/app
      - /app/api/obj
      - /app/api/bin
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - city_explorer_net

  worker-dev:
    container_name: z_city_explorer_worker_dev
    build:
      context: ./csharp
      dockerfile: worker/Dockerfile.dev
    environment:
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres-dev;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__RedisConnection=redis-dev:6379
    volumes:
      - ./csharp:/app
      - /app/worker/obj
      - /app/worker/bin
      - /app/api/obj
      - /app/api/bin
      - /app/tests/obj
      - /app/tests/bin
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
    networks:
      - city_explorer_net

networks:
  city_explorer_net:
    driver: bridge
